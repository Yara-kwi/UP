<section class="section">

  <div class="section-label">Booking</div>

  <h2 class="section-title">Book Your Safari</h2>

  <form class="booking-form">

    <input type="text" placeholder="Full Name" required>

    <input type="email" placeholder="Email Address" required>

    <input type="tel" placeholder="Phone Number">

    <select required>
      <option value="">Select Package</option>
      <option>5-Day Honeymoon Safari</option>
      <option>3-Day Gorilla Trekking</option>
      <option>7-Day Rwanda Safari</option>
      <option>Luxury Wildlife Trip</option>
    </select>

    <input type="date" required>

    <textarea placeholder="Message / Special Requests"></textarea>

    <button type="submit">Send Booking Request</button>

  </form>

</section>
